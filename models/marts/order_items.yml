models:
  - name: order_items
    config:
      contract:
        enforced: true    
    description: Orders overview data mart, offering key details for each unique orders.
    columns:
      - name: order_item_id
        data_type: varchar(250)
        entity:
          type: primary
          name: order_item
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_type: varchar(250)
        entity:
          type: foreign
          name: sales_order
        data_tests:
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
      - name: IS_DRINK_ITEM
        data_type: BOOLEAN
      - name: IS_FOOD_ITEM
        data_type: BOOLEAN
      - name: ORDER_DATE
        data_type: DATE
        granularity: day
        dimension:
          type: time
          name: order_date

      - name: PRODUCT_ID
        data_type: varchar(250)      
      - name: PRODUCT_NAME
        data_type: varchar(250)
      - name: PRODUCT_PRICE
        data_type: NUMBER(16,2)      
      - name: SUPPLY_COST
        data_type: NUMBER(28,2)      

    semantic_model:
      enabled: true
      name: order_items
    agg_time_dimension: order_date
    metrics:
      - name: total_expense
        description: Total supply cost in USD for the items sold, excluding other operating expenses.
        type: simple
        label: Total Supply Expenses
        agg: sum
        expr: supply_cost
      - name: total_items_sold
        description: Number of order-item rows. Each row represents one item sold.
        type: simple
        label: Total Items Sold
        agg: count
        expr: order_item_id
      - name: total_orders_with_items
        description: Distinct orders represented in the selected order items. Product filters restrict this count to orders containing matching items.
        type: simple
        label: Orders with Items
        agg: count_distinct
        expr: order_id
      - name: total_gross_sales
        description: Sum of product prices in USD for items sold, before order-level taxes or discounts.
        type: simple
        label: Total Gross Sales
        agg: sum
        expr: product_price
      - name: average_gross_sales
        description: Average product price in USD per item sold, before order-level taxes or discounts.
        type: simple
        label: Average Gross Sales per Item
        agg: average
        expr: product_price
      - name: average_items_per_sale
        description: Items sold divided by distinct orders containing those items within the selected period and filters.
        type: ratio
        label: Average Items per Sale
        numerator: total_items_sold
        denominator: total_orders_with_items



unit_tests:
  - name: test_supply_costs_sum_correctly
    description: "Test that the supply costs sum correctly by product."
    model: order_items
    given:
      - input: ref('stg_supplies', v='1')
        rows:
          - { supply_uuid: 1, supply_id: 1, product_id: 1, supply_name: "A", supply_cost: 4.50, is_perishable_supply: true }
          - { supply_uuid: 2, supply_id: 2, product_id: 2, supply_name: "B", supply_cost: 3.50, is_perishable_supply: false }
          - { supply_uuid: 3, supply_id: 3, product_id: 2, supply_name: "B", supply_cost: 5.00, is_perishable_supply: false }
      - input: ref('stg_products')
        rows:
          - { product_id: 1 }
          - { product_id: 2 }
      - input: ref('stg_order_items')
        rows:
          - { order_id: 1, product_id: 1, order_item_id: 1 }
          - { order_id: 2, product_id: 2, order_item_id: 2 }
          - { order_id: 2, product_id: 2, order_item_id: 3 }
      - input: ref('stg_orders')
        rows:
          - { order_id: 1 }
          - { order_id: 2 }
    expect:
      rows:
        - { order_id: 1, product_id: 1, supply_cost: 4.50 }
        - { order_id: 2, product_id: 2, supply_cost: 8.50 }
        - { order_id: 2, product_id: 2, supply_cost: 8.50 }
